name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows matrise 28.07.2026'da eklendi. O güne dek yalnızca Ubuntu ve
        # macOS koşuluyordu ve Windows'a özgü ÜÇ hata fark edilmemişti:
        # validate_delta hiç çalışmıyordu, benchmark koşucusu her komutu
        # "bulunamadı" sayıyordu ve testlerin dördü ortam yüzünden düşüyordu.
        # Bir platformda koşmayan test, o platformda olmayan testtir.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck and static safety lint
        run: npm run lint
      - name: Full test suite
        # npm test -- --test-reporter=dot KULLANILMAZ: npm ek argümanları
        # scriptin SONUNA ekler, yani bayrak dosya adlarından sonra gelir ve
        # Node 20'nin test koşucusu onu bir dosya yolu sanar
        # ("Could not find .../--test-reporter=dot"). Node 22+ hoşgörülü
        # davrandığı için hata yalnızca Node 20'de görünüyordu.
        run: npm run test:ci
      - name: Live MCP smoke test
        run: node smoke_test.mjs
      - name: Synthetic token-volume guard
        run: node benchmark_test.mjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Audit lockfile
        run: npm audit --audit-level=low
